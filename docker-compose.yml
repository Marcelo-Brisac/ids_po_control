services:
  db:
    image: postgres:16-alpine
    container_name: ids_po_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ids_po_control
      POSTGRES_USER: ids_po_user
      POSTGRES_PASSWORD: ids_po_password_2026
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids_po_user -d ids_po_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ids_po_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn portal.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
