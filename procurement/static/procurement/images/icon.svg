<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Pigeon in flight: sleek, pointed silhouette (no chubby curves) -->
  <g>
    <!-- tail feathers: swept back, level with body -->
    <path d="M355 585 L 170 545 L 330 615 Z" fill="#FFFFFF"/>
    <path d="M365 610 L 195 610 L 345 645 Z" fill="#EAF0FF"/>

    <!-- body + head silhouette: slim, tapered -->
    <path d="M330 620
             C 300 540, 330 460, 410 415
             C 460 388, 510 385, 545 400
             C 555 370, 580 345, 615 332
             C 650 320, 685 322, 712 340
             C 700 355, 682 365, 662 368
             L 745 385 L 668 415
             C 690 445, 695 480, 682 515
             C 665 560, 625 592, 575 605
             C 500 625, 415 622, 355 600
             C 345 613, 337 618, 330 620 Z"
          fill="#FFFFFF"/>

    <!-- sharp swept wing (angular, pointed tip, layered on back) -->
    <path d="M420 430
             L 560 400
             L 660 440
             L 590 470
             L 500 460
             L 430 480
             Z" fill="#C9DAFF"/>
    <path d="M450 450 L 590 445" stroke="#A9C2FF" stroke-width="6" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="668" cy="352" r="8" fill="#1E3A8A"/>
  </g>

  <!-- small message capsule carried in beak (classic carrier-pigeon touch) -->
  <g>
    <rect x="745" y="365" width="66" height="40" rx="6" fill="#FCD34D"/>
    <path d="M745 371 L 778 390 L 811 371" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
